name: Bug report
description: Report a reproducible SDK defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, API tokens, tenant data, or unredacted API responses.
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.2.30
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: php
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation
      description: Include relevant test output with sensitive values removed.
